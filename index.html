<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XTS SplitTool OTA</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 10%, #16335e, #060b14 55%);
        color: #e6edf7;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: min(520px, calc(100vw - 40px));
        padding: 30px;
        border: 1px solid rgba(91, 156, 255, 0.25);
        border-radius: 18px;
        background: rgba(16, 28, 46, 0.78);
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(12px);
      }
      .eyebrow {
        color: #79aaff;
        font-size: 11px;
        letter-spacing: 0.2em;
        font-family: ui-monospace, monospace;
      }
      h1 { margin: 8px 0 6px; font-size: 28px; letter-spacing: -0.5px; }
      p { color: #93a4bd; font-size: 13px; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 10px;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(135deg, #5b9cff, #8b5cf6);
      }
      code { color: #b9cdf0; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">OTA UPDATE</div>
      <h1>XTS SplitTool</h1>
      <p>最新版本：<strong>1.5.2</strong></p>
      <p>客户端更新源：<br /><code>https://heimaclh.github.io/XTS_SplitTool_OTA/latest.json</code></p>
      <a href="https://github.com/heimaclh/XTS_SplitTool_OTA/releases">下载安装包</a>
    </main>
  </body>
</html>
